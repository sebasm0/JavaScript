<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda Online</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="js/productos.js" defer></script>
  <script src="js/carrito.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Mi Tienda Online</h1>
  </header>

  <div class="container">
    <div class="buscar">
      <input type="text" id="buscar" placeholder="Buscar productos...">
    </div>

    <div id="cargando" style="text-align:center;padding:20px;color:#999">Cargando productos...</div>

    <div class="productos-grid" id="productos-grid"></div>

    <div class="carrito-seccion">
      <h2>Carrito</h2>
      <div id="carrito-items"></div>
      <div class="carrito-footer" id="carrito-footer" style="display:none">
        <div class="total" id="carrito-total"></div>
        <div class="botones">
          <button class="btn-vaciar" id="btn-vaciar">Vaciar carrito</button>
          <button class="btn-confirmar" id="btn-confirmar">Confirmar compra</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
