<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 10 - Tienda</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.css">
</head>
<body>
    <h1>Mi Tienda</h1>
    <form id="formProducto">
        <input type="text" id="inputNombre" placeholder="Nombre">
        <input type="number" id="inputPrecio" placeholder="Precio">
        <input type="number" id="inputStock" placeholder="Stock">
        <button type="submit">Agregar</button>
    </form>
    <input type="text" id="inputFiltro" placeholder="Filtrar...">
    <p id="aviso"></p>
    <p id="mensaje"></p>
    <ul id="listaProductos"></ul>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0"></script>
    <script src="Ejercicio10.js"></script>
</body>
</html>
